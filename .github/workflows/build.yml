name: Build APK

# 触发条件：
#   1) 推到 main/master 分支自动构建
#   2) 也可以在 GitHub 网页上手动点按钮触发
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 构建 RidiPager APK
    runs-on: ubuntu-latest

    steps:
      # ---------- 1. 拉取代码 ----------
      - name: 检出代码
        uses: actions/checkout@v4

      # ---------- 2. 装 JDK 17（AGP 8.x 要求） ----------
      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ---------- 3. Android SDK ----------
      # ubuntu-latest runner 已预装 Android SDK（$ANDROID_HOME），无需再装
      - name: 确认 Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version || true
          ls "$ANDROID_HOME/platforms" || true

      # ---------- 4. 安装 Gradle（不依赖 gradle-wrapper.jar） ----------
      - name: 安装 Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      # ---------- 5. 缓存依赖（加速后续构建） ----------
      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ---------- 6. 构建 Debug APK ----------
      - name: 构建 Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      # ---------- 7. 上传 APK ----------
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: RidiPager-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90
          if-no-files-found: error
